<meta charset="utf-8">
<style>
@font-face{font-family:PJS;src:url(assets/pjs-800.woff2) format('woff2');font-weight:800}
@font-face{font-family:PJS;src:url(assets/pjs-600.woff2) format('woff2');font-weight:600}
@font-face{font-family:PJS;src:url(assets/pjs-500.woff2) format('woff2');font-weight:500}
:root{                      /* SAFE — clears Instagram's chrome */
  --logo-top:262px; --bar-top:250px; --sc-top:372px; --sc-bottom:640px;
  --src-bottom:566px; --card-mr:0px; --plot-h:470px; --plot-mt:40px;
  --h1:76px; --big:54px; --q:58px; --ico:136px; --icoImg:80px; --endLogo:540px}
body.full{                  /* FULL — no platform overlay, use the whole frame */
  --logo-top:104px; --bar-top:0px;  --sc-top:230px; --sc-bottom:170px;
  --src-bottom:78px;  --card-mr:0px;   --plot-h:620px; --plot-mt:30px;
  --h1:84px; --big:60px; --q:64px; --ico:158px; --icoImg:92px; --endLogo:620px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:PJS,sans-serif;background:#05070f;color:#fff;position:relative}

/* ============ persistent background ============ */
#bgGrad{position:absolute;inset:0;background:
  radial-gradient(85% 50% at 46% -10%,#223175 0%,rgba(34,49,117,0) 62%),
  radial-gradient(58% 38% at 92% 26%,#6b41bd 0%,rgba(107,65,189,0) 62%),
  linear-gradient(178deg,#0c1230 0%,#080c20 46%,#05070f 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(105px)}
#orbA{width:640px;height:640px;left:-210px;top:200px;background:rgba(58,96,240,.26)}
#orbB{width:470px;height:470px;right:-150px;top:760px;background:rgba(245,196,81,.10)}
#photoWrap{position:absolute;inset:0;overflow:hidden}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:1;filter:saturate(1.12) contrast(1.03)}
#photoFade{position:absolute;inset:0;background:linear-gradient(180deg,
  rgba(5,7,15,.62) 0%,rgba(5,7,15,.50) 22%,rgba(5,7,15,.34) 44%,
  rgba(5,7,15,.30) 62%,rgba(5,7,15,.55) 84%,rgba(5,7,15,.86) 100%)}
#dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,.30) 0%,rgba(5,7,15,.55) 45%,rgba(5,7,15,.78) 100%);opacity:0}
#grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* ============ persistent chrome ============ */
#barTrack{position:absolute;top:var(--bar-top);left:0;width:100%;height:2px;z-index:9;
  background:rgba(150,190,240,.14)}
#barFill{position:absolute;left:0;top:0;height:2px;width:0;
  background:linear-gradient(90deg,rgba(90,170,255,0) 0%,rgba(120,195,255,.35) 55%,
    rgba(190,230,255,.95) 92%,#ffffff 100%);
  box-shadow:0 0 10px rgba(120,195,255,.55)}
#barHead{position:absolute;top:1px;left:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;
  border-radius:50%;background:#eaf6ff;
  box-shadow:0 0 8px 2px rgba(160,215,255,.95),0 0 22px 6px rgba(90,170,255,.65),
             0 0 48px 14px rgba(60,140,255,.35)}
#logo{position:absolute;top:var(--logo-top);left:80px;width:252px;z-index:8}
#srcline{position:absolute;bottom:var(--src-bottom);left:80px;right:80px;display:flex;justify-content:space-between;
  align-items:flex-end;font-weight:500;font-size:19px;color:#8593bb;letter-spacing:.05em;z-index:8;
  text-shadow:0 2px 14px rgba(5,7,15,.95)}
#srcline b{font-weight:600;color:#a8b5d8}

/* ============ scene shell ============ */
.sc{position:absolute;left:80px;right:80px;top:var(--sc-top);bottom:var(--sc-bottom);opacity:0;
  display:flex;flex-direction:column;justify-content:center}
.mask{overflow:hidden;display:block}
.pill{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;
  padding:13px 28px 13px 22px;border-radius:100px;margin-bottom:38px;
  background:linear-gradient(140deg,rgba(245,196,81,.22),rgba(245,196,81,.07));
  border:1px solid rgba(245,196,81,.45);
  font-weight:600;font-size:24px;letter-spacing:.20em;color:#ffdd85}
.pill i{width:11px;height:11px;border-radius:50%;background:#f5c451;
  box-shadow:0 0 16px 4px rgba(245,196,81,.65);display:block}
.glass{position:relative;border-radius:42px;padding:44px 48px;
  background:linear-gradient(168deg,rgba(255,255,255,.088),rgba(255,255,255,.024));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 46px 110px -30px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.15);
  backdrop-filter:blur(20px)}
.gold{background:linear-gradient(97deg,#ffdd85,#f5c451 46%,#dd9d26);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ---- S1 hook ---- */
#s1 h1{font-weight:800;font-size:var(--h1);line-height:1.06;letter-spacing:-.035em}
#s1 .sub{margin-top:34px;font-weight:500;font-size:33px;line-height:1.42;color:#9dadd6;max-width:820px}

/* ---- S2 stat / chart ---- */
#s2 .glass{margin-left:calc(var(--card-mr) / 2);margin-right:calc(var(--card-mr) / 2)}
#cardHd{display:flex;align-items:center;gap:20px}
#cardHd img{width:58px;height:58px}
#cardHd span{font-weight:600;font-size:28px;letter-spacing:.14em;color:#c3d0f0}
#plot{position:relative;height:var(--plot-h);margin-top:var(--plot-mt)}
.grid{position:absolute;left:0;right:104px;height:1px;background:rgba(255,255,255,.13);transform-origin:left center}
.gtx{position:absolute;right:0;transform:translateY(50%);font-weight:500;font-size:20px;color:#606e99;letter-spacing:.06em;opacity:0}
#axis{position:absolute;left:0;right:104px;height:2px;transform-origin:left center;
  background:linear-gradient(90deg,rgba(255,255,255,.36),rgba(255,255,255,.08))}
#bars{position:absolute;left:30px;right:160px;top:0;display:flex;align-items:flex-end;gap:88px}
.col{flex:1;display:flex;flex-direction:column;align-items:center}
.val{font-weight:800;font-size:50px;letter-spacing:-.025em;margin-bottom:18px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:relative;overflow:hidden;width:100%;border-radius:18px 18px 4px 4px;transform-origin:bottom center}
.shine{position:absolute;top:-25%;left:0;width:46%;height:150%;pointer-events:none;
  transform:skewX(-20deg) translateX(-160%);
  background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.10) 30%,
    rgba(255,255,255,.62) 50%,rgba(255,255,255,.10) 70%,rgba(255,255,255,0) 100%)}
.neon{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.bar.b{background:linear-gradient(180deg,#6480ea,#2f4399);
  box-shadow:0 0 44px -8px rgba(95,124,232,.5),inset 0 1px 0 rgba(255,255,255,.26)}
.bar.g{background:linear-gradient(180deg,#ffdd85,#e5a32b);
  box-shadow:0 0 74px -4px rgba(245,196,81,.6),inset 0 1px 0 rgba(255,255,255,.55)}
.val.b{color:#a9bcff} .val.g{color:#ffdd85}
#badge{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;padding:10px 22px;border-radius:100px;
  background:linear-gradient(140deg,rgba(245,196,81,.26),rgba(245,196,81,.08));
  border:1px solid rgba(245,196,81,.5);box-shadow:0 0 42px -8px rgba(245,196,81,.55);
  font-weight:600;font-size:23px;color:#ffdd85;white-space:nowrap}
#badge b{font-weight:800;font-size:31px;letter-spacing:-.02em}
#xlab{position:absolute;left:30px;right:160px;bottom:0;display:flex;gap:88px}
.xl{flex:1;text-align:center;font-weight:600;font-size:25px;color:#8b9ac6;line-height:1.32}
/* big-stat fallback (no chart in the data) */
#bigwrap{text-align:center;padding:40px 0 20px}
#bignum{font-weight:800;font-size:180px;line-height:1;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums}
#bigunit{font-weight:600;font-size:52px;color:#ffdd85;margin-top:6px;letter-spacing:-.01em}
#biglab{font-weight:500;font-size:32px;color:#9dadd6;margin-top:26px;line-height:1.4}

/* ---- S3 / S4 text scenes ---- */
.icoTile{position:relative;width:var(--ico);height:var(--ico);border-radius:36px;margin-bottom:34px;
  display:flex;align-items:center;justify-content:center;flex:none;align-self:flex-start;
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.17);
  box-shadow:0 26px 60px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.22);
  backdrop-filter:blur(14px)}
.icoTile img{width:var(--icoImg);height:var(--icoImg);display:block}
.icoBig{width:112px;height:112px;margin-bottom:40px}
.big{font-weight:800;font-size:var(--big);line-height:1.22;letter-spacing:-.028em;
  text-shadow:0 3px 26px rgba(5,7,15,.9)}
.lead{font-weight:600;font-size:27px;letter-spacing:.20em;color:#8b9ac6;margin-bottom:26px}
#s4 .rule{width:96px;height:6px;border-radius:6px;margin-bottom:36px;
  background:linear-gradient(90deg,#ffdd85,#e5a32b);box-shadow:0 0 26px rgba(245,196,81,.6);transform-origin:left center}

/* ---- S5 question ---- */
#s5{align-items:center;text-align:center}
#s5 .icoTile{align-self:center}
#s5 .q{text-shadow:0 3px 26px rgba(5,7,15,.9);font-weight:800;font-size:var(--q);line-height:1.24;letter-spacing:-.028em;max-width:860px}
#s5 .cta{margin-top:46px;font-weight:600;font-size:29px;color:#ffdd85;letter-spacing:.04em}

/* ---- S6 end card ---- */
#s6{align-items:center;justify-content:center;text-align:center}
#endLogo{width:var(--endLogo)}
#endRule{width:0;height:2px;margin:52px 0 44px;
  background:linear-gradient(90deg,rgba(245,196,81,0),#f5c451,rgba(245,196,81,0))}
#endTag{font-weight:600;font-size:34px;color:#c7d3f2;letter-spacing:.01em}
#endUrl{margin-top:22px;font-weight:600;font-size:27px;color:#8593bb;letter-spacing:.22em}
#lens{position:absolute;width:150px;opacity:.9}
</style>

<script>
gsap.ticker.remove(gsap.updateRoot);
gsap.config({force3D:false});

const q = new URLSearchParams(location.search);
const LAYOUT = q.get('layout') || (window.DATA && window.DATA.layout) || 'safe';
if (LAYOUT === 'full') document.body.classList.add('full');

const D = window.DATA;
const $ = s => document.querySelector(s);
const nf = n => Math.round(n).toLocaleString('en-US');

/* ---------- populate ---------- */
$('#srcName').textContent = D.source;
$('#srcDate').textContent = D.date;
$('#s1kick').textContent  = D.kicker;
$('#s1sub').textContent   = D.sub;
$('#s2label').textContent = D.statLabelShort || 'THE NUMBER';
$('#s3txt').textContent   = D.detail;
$('#s4txt').textContent   = D.takeaway;
$('#s5txt').textContent   = D.question;
if (D.icons) {
  if (D.icons.stat)     $('#s2ico').src = 'assets/' + D.icons.stat + '.svg';
  if (D.icons.detail)   $('#s3ico').src = 'assets/' + D.icons.detail + '.svg';
  if (D.icons.takeaway) $('#s4ico').src = 'assets/' + D.icons.takeaway + '.svg';
}

/* hook: split into masked lines, gold tail */
(() => {
  const words = D.hook.split(' ');
  const tail  = (D.hookGold || '').split(' ').filter(Boolean);
  const head  = words.slice(0, words.length - tail.length);
  const lines = [];
  // wrap head to <= 20 chars per line
  let cur = '';
  head.forEach(w => {
    if ((cur + ' ' + w).trim().length > 20) { lines.push({t: cur.trim(), g: false}); cur = w; }
    else cur = (cur + ' ' + w).trim();
  });
  if (cur) lines.push({t: cur, g: false});
  if (tail.length) lines.push({t: tail.join(' '), g: true});
  $('#s1hook').innerHTML = lines.map(l =>
    `<span class="mask"><span class="ln${l.g ? ' gold' : ''}">${l.t}</span></span>`).join('');
})();

/* ---------- chart or big stat ---------- */
const hasChart = !!(D.chart && D.chart.bars && D.chart.bars.length);
let chartTargets = [];
if (hasChart) {
  const bars = D.chart.bars, maxV = Math.max(...bars.map(b => b.value));
  const nice = Math.pow(10, Math.floor(Math.log10(maxV))) * Math.ceil(maxV / Math.pow(10, Math.floor(Math.log10(maxV))));
  $('#bars').innerHTML = bars.map((b, i) => `
    <div class="col">
      ${b.badge ? `<div id="badge"><b>${b.badge.split(' ')[0]}</b>${b.badge.split(' ').slice(1).join(' ')}</div>` : ''}
      <div class="val ${b.color === 'gold' ? 'g' : 'b'}" id="v${i}">0</div>
      <div class="bar ${b.color === 'gold' ? 'g' : 'b'}" id="bar${i}"><div class="shine"></div></div>
    </div>`).join('');
  $('#xlab').innerHTML = bars.map(b => `<div class="xl">${b.label.replace('\n', '<br>')}</div>`).join('');

  const PH = $('#plot').clientHeight, XLABH = 88,
        H = PH - XLABH, MAX = LAYOUT === 'full' ? .60 : .52;
  const px = v => (v / nice) * MAX * H;
  $('#axis').style.bottom = XLABH + 'px';
  $('#bars').style.bottom = XLABH + 'px';
  document.querySelectorAll('.grid').forEach(g => {
    g.style.bottom = (XLABH + px(nice * +g.dataset.f)) + 'px'; g.style.transform = 'scaleX(0)';
  });
  document.querySelectorAll('.gtx').forEach(t => {
    const v = nice * +t.dataset.f;
    t.style.bottom = (XLABH + px(v)) + 'px';
    t.textContent = v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : Math.round(v / 1e3) + 'K';
  });
  bars.forEach((b, i) => {
    const el = document.getElementById('bar' + i);
    el.style.height = px(b.value) + 'px'; el.style.transform = 'scaleY(0)';
    chartTargets.push({i, v: b.value});
  });
} else {
  $('#plot').style.display = 'none';
  $('#bigwrap').style.display = 'block';
  $('#bigunit').textContent = D.statUnit || '';
  $('#biglab').textContent  = D.statLabel || '';
}

/* ---------- auto-fit: never let long copy break a scene ---------- */
function fit(el, max, min) {
  let s = max; el.style.fontSize = s + 'px';
  const box = el.parentElement;
  while (s > min && (el.scrollHeight > box.clientHeight * 0.94 || el.scrollWidth > box.clientWidth)) {
    s -= 2; el.style.fontSize = s + 'px';
  }
}
const CS = getComputedStyle(document.body);
const pxv = n => parseFloat(CS.getPropertyValue(n));
fit($('#s1hook'), pxv('--h1'), 46);
fit($('#s3txt'), pxv('--big'), 33);
fit($('#s4txt'), pxv('--big'), 33);
fit($('#s5txt'), pxv('--q'), 36);

/* ---------- neon perimeter runner ----------
   A short bright dash chases the outline of a box to pull the eye to it. */
const NS = 'http://www.w3.org/2000/svg';
function neon(el, radius, color, dash) {
  const w = el.offsetWidth, h = el.offsetHeight;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'neon');
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', 1.5); r.setAttribute('y', 1.5);
  r.setAttribute('width', w - 3); r.setAttribute('height', h - 3);
  r.setAttribute('rx', radius); r.setAttribute('fill', 'none');
  r.setAttribute('stroke', color); r.setAttribute('stroke-width', 3);
  r.setAttribute('stroke-linecap', 'round');
  svg.appendChild(r); el.appendChild(svg);
  const L = r.getTotalLength();
  r.style.strokeDasharray  = dash + ' ' + Math.max(1, L - dash);
  r.style.strokeDashoffset = L;
  r.style.filter = `drop-shadow(0 0 8px ${color}) drop-shadow(0 0 22px ${color})`;
  r.style.opacity = 0;
  return {r, L};
}
function runNeon(tlx, el, radius, color, dash, at, lapDur, laps) {
  const tail = neon(el, radius, color, dash * 2.1);   // long faint trail
  const core = neon(el, radius, color, dash);         // bright leading edge
  tail.r.setAttribute('stroke-width', 2);
  tail.r.style.filter = `drop-shadow(0 0 14px ${color})`;
  core.r.style.filter = `drop-shadow(0 0 7px ${color}) drop-shadow(0 0 20px ${color}) drop-shadow(0 0 42px ${color})`;
  const span = lapDur * laps;
  [[tail, .30], [core, .92]].forEach(([n, op]) => {
    tlx.to(n.r, {opacity: op, duration: .40}, at)
       .fromTo(n.r, {strokeDashoffset: n.L}, {strokeDashoffset: 0, duration: lapDur,
               ease: 'none', repeat: laps - 1}, at)
       .to(n.r, {opacity: 0, duration: .5}, at + span - .5);
  });
}

/* ---------- master timeline ---------- */
const SC = [
  {el: '#s1', t: 0.20, d: 4.00},
  {el: '#s2', t: 4.20, d: 6.00},
  {el: '#s3', t: 10.20, d: 4.00},
  {el: '#s4', t: 14.20, d: 4.00},
  {el: '#s5', t: 18.20, d: 3.20},
  {el: '#s6', t: 21.40, d: 3.40},
];
const TOTAL = 24.8;
const tl = gsap.timeline({paused: true});

/* ambient — one continuous move across the whole reel */
tl.fromTo('#orbA', {x: 0, y: 0}, {x: 60, y: -40, duration: TOTAL, ease: 'none'}, 0)
  .fromTo('#orbB', {x: 0, y: 0}, {x: -50, y: 30, duration: TOTAL, ease: 'none'}, 0)
  .fromTo('#barFill', {width: '0%'}, {width: '100%', duration: TOTAL, ease: 'none'}, 0)
  .fromTo('#barHead', {left: '0%'}, {left: '100%', duration: TOTAL, ease: 'none'}, 0)
  .from('#logo', {opacity: 0, y: -16, scale: .93, duration: .7, ease: 'power3.out'}, 0.10)
  .from('#srcline', {opacity: 0, duration: .7}, 0.55);

/* generic scene in/out */
SC.forEach(s => {
  tl.set(s.el, {opacity: 1}, s.t)
    .to(s.el, {opacity: 0, duration: .34, ease: 'power2.in'}, s.t + s.d - .34)
    .set(s.el, {opacity: 0}, s.t + s.d);
});

/* S1 */
tl.from('#s1 .pill', {opacity: 0, y: 20, scale: .9, duration: .5, ease: 'back.out(2)'}, 0.28)
  .from('#s1 .ln', {yPercent: 112, duration: .82, ease: 'power4.out', stagger: .10}, 0.44)
  .from('#s1 .sub', {opacity: 0, y: 24, duration: .6, ease: 'power3.out'}, 1.05);

/* S2 */
tl.from('#s2 .glass', {opacity: 0, y: 48, scale: .976, duration: .7, ease: 'power3.out'}, 4.24)
  .from('#s2ico', {scale: 0, rotate: -40, duration: .6, ease: 'back.out(2.4)'}, 4.50)
  .from('#s2label', {opacity: 0, x: -16, duration: .5}, 4.58);

if (hasChart) {
  tl.from('#axis', {scaleX: 0, duration: .7, ease: 'power3.inOut'}, 4.70)
    .to('.grid', {scaleX: 1, duration: .58, ease: 'power2.out', stagger: .06}, 4.84)
    .to('.gtx', {opacity: 1, duration: .42, stagger: .06}, 4.92)
    .from('.xl', {opacity: 0, y: 14, duration: .48, stagger: .09}, 5.00);
  chartTargets.forEach((c, k) => {
    const at = 5.24 + k * 0.78, dur = .9 + k * .2;
    const o = {n: 0};
    tl.to('#bar' + c.i, {scaleY: 1, duration: dur, ease: 'power3.out'}, at)
      .to(o, {n: c.v, duration: dur, ease: 'power3.out',
              onUpdate: () => {document.getElementById('v' + c.i).textContent = nf(o.n)}}, at)
      .from('#v' + c.i, {opacity: 0, duration: .28}, at);
  });
  if (document.getElementById('badge'))
    tl.from('#badge', {scale: .4, opacity: 0, duration: .62, ease: 'back.out(2.7)'}, 7.30);
} else {
  const o = {n: 0}, target = D.statValue || 0;
  tl.to(o, {n: target, duration: 1.5, ease: 'power3.out',
            onUpdate: () => {$('#bignum').textContent = nf(o.n)}}, 4.80)
    .from('#bignum', {opacity: 0, scale: .8, duration: .6, ease: 'back.out(1.8)'}, 4.80)
    .from('#bigunit', {opacity: 0, y: 18, duration: .5}, 5.60)
    .from('#biglab', {opacity: 0, y: 18, duration: .5}, 5.85);
}

/* S3 */
tl.from('#s3 .icoTile', {scale: 0, rotate: -25, duration: .62, ease: 'back.out(2.2)'}, 10.28)
  .from('#s3 .lead', {opacity: 0, x: -18, duration: .5}, 10.46)
  .from('#s3txt', {opacity: 0, y: 30, duration: .7, ease: 'power3.out'}, 10.58);

/* S4 */
tl.from('#s4 .icoTile', {scale: 0, rotate: 25, duration: .62, ease: 'back.out(2.2)'}, 14.28)
  .from('#s4 .rule', {scaleX: 0, duration: .55, ease: 'power3.out'}, 14.48)
  .from('#s4 .lead', {opacity: 0, x: -18, duration: .5}, 14.56)
  .from('#s4txt', {opacity: 0, y: 30, duration: .7, ease: 'power3.out'}, 14.66);

/* S5 */
tl.from('#s5 .icoTile', {scale: 0, y: 30, duration: .66, ease: 'back.out(2.3)'}, 18.28)
  .from('#s5txt', {opacity: 0, y: 30, duration: .7, ease: 'power3.out'}, 18.50)
  .from('#s5 .cta', {opacity: 0, y: 18, duration: .55}, 18.86);

/* S6 */
tl.fromTo('#lens', {scale: .2, opacity: 0, rotate: -120}, {scale: 1, opacity: .9, rotate: 0, duration: .9, ease: 'back.out(1.7)'}, 21.46)
  .to('#lens', {opacity: 0, scale: 2.6, duration: .5, ease: 'power2.in'}, 22.10)
  .from('#endLogo', {opacity: 0, scale: .86, duration: .75, ease: 'back.out(1.6)'}, 22.24)
  .to('#endRule', {width: 480, duration: .7, ease: 'power3.out'}, 22.70)
  .from('#endTag', {opacity: 0, y: 20, duration: .6}, 22.92)
  .from('#endUrl', {opacity: 0, y: 16, duration: .6}, 23.14);

/* background steps back while body copy is on screen, forward for hook / stat / end */
tl.set('#dim', {opacity: 0}, 0)
  .to('#dim', {opacity: .55, duration: .5, ease: 'power2.inOut'}, 10.10)   // S3 in
  .to('#dim', {opacity: .62, duration: .4, ease: 'none'}, 14.20)           // S4
  .to('#dim', {opacity: .58, duration: .4, ease: 'none'}, 18.20)           // S5
  .to('#dim', {opacity: 0,   duration: .6, ease: 'power2.inOut'}, 21.30);  // S6 opens up

/* neon runners — card and icon tiles */
runNeon(tl, document.querySelector('#s2 .glass'), 42, '#eef3ff', 700, 4.55, 2.6, 2);
runNeon(tl, document.querySelector('#s3 .icoTile'), 40, '#eaf0ff', 300, 10.50, 1.6, 2);
runNeon(tl, document.querySelector('#s4 .icoTile'), 40, '#eaf0ff', 300, 14.50, 1.6, 2);
runNeon(tl, document.querySelector('#s5 .icoTile'), 40, '#eaf0ff', 300, 18.50, 1.4, 2);

/* looping diagonal shine across each solid bar, once it has finished growing */
document.querySelectorAll('.shine').forEach((sh, i) => {
  const start = 6.35 + i * 0.55;
  tl.fromTo(sh, {xPercent: -160}, {xPercent: 420, duration: 1.5, ease: 'power1.inOut',
            repeat: 1, repeatDelay: .7}, start);
});

const photoEl = document.getElementById('photo');
window.HASBG = false;
window.SEEKF = async (t, i) => {
  if (window.HASBG) {
    photoEl.src = 'bg/f' + String(i).padStart(5, '0') + '.jpg';
    try { await photoEl.decode(); } catch (e) {}
  }
  tl.time(t); gsap.updateRoot(t);
};
window.SEEK = t => {tl.time(t); gsap.updateRoot(t)};
window.DUR  = TOTAL;
if (q.get('guide')) document.getElementById('guide').style.display='block';
document.fonts.ready.then(() => {window.READY = true});
</script>
