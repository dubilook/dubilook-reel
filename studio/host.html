<!doctype html>
<meta charset="utf-8">
<title>Dubilook studio host</title>
<body style="margin:0;background:#111">
<script src="/stories-renderer.js"></script>
<script src="/studio/post-renderer.js"></script>
<script src="/studio/edu-renderer.js"></script>
<script src="/studio/ar-renderer.js"></script>
<script src="/studio/keyword-badge.js"></script>
<script>
  const SRC = {
    "pjs-500": "/assets/pjs-500.woff2", "pjs-600": "/assets/pjs-600.woff2", "pjs-800": "/assets/pjs-800.woff2",
    "anton": "/assets/anton.woff2", "logo-lens": "/assets/logo-lens.png", "logo-light": "/assets/logo-light.png", "logo-dark": "/assets/logo-dark.png",
    "logo-dark-bg": "/assets/logo-dark-bg.png", "logo-light-bg": "/assets/logo-light-bg.png",
    "cairo": "/assets/cairo.ttf", "lalezar": "/assets/lalezar.ttf",
    "barlow-800": "/assets/barlow-800.woff2"
  };
  window.ready = (async () => {
    const a = await window.DUBILOOK_STORIES.init(SRC);
    const b = await window.DUBILOOK_POSTS.init(SRC);
    const e = await window.DUBILOOK_EDU.init(SRC);
    const r = await window.DUBILOOK_AR.init(SRC);
    return { stories: a, posts: b, edu: e, ar: r };
  })();
  // kind: "story" (stories-renderer, 1080x1920) | "post" (1080x1350) | "post-story" (post-renderer at 1920)
  //       | "edu" (edu-renderer, light theme, 1080x1350) | "ar" (Arabic post 1080x1350) | "ar-story" (Arabic 1080x1920)
  window.renderCard = (kind, card, quality) => {
    const c = document.createElement("canvas");
    c.width = 1080;
    c.height = kind === "post" || kind === "edu" || kind === "ar" ? 1350 : 1920;
    const ctx = c.getContext("2d");
    if (kind === "story") window.DUBILOOK_STORIES.draw(ctx, card, {});
    else if (kind === "edu") window.DUBILOOK_EDU.draw(ctx, card);
    else if (kind === "ar" || kind === "ar-story") window.DUBILOOK_AR.draw(ctx, card, c.height);
    else window.DUBILOOK_POSTS.draw(ctx, card, c.height);
    // R68 (owner 2026-10-17): the corner keyword badge, drawn last on every 4:5 card with dm_keyword
    // (news/photo layouts, carousel cover + content slides, Arabic, edu). 9:16 stories never get it.
    const R = kind === "edu" ? window.DUBILOOK_EDU : kind === "ar" || kind === "ar-story" ? window.DUBILOOK_AR : window.DUBILOOK_POSTS;
    const boxes = R && typeof R.boxes === "function" ? R.boxes() : [];
    const badge = c.height === 1350 && card.dm_keyword ? window.DUBILOOK_BADGE.draw(ctx, card.dm_keyword, c.width) : null;
    window.lastRender = { kind, badge, boxes };
    return c.toDataURL("image/jpeg", quality || 0.92);
  };
</script>
</body>
